services:
  rustatio:
    image: ghcr.io/takitsu21/rustatio:latest@sha256:f452a603ffba6c1a728835e7809727580ed1c39ee8f2cddca87203dfa2298013
    container_name: rustatio
    ports:
      - "${WEBUI_PORT:-8080}:8080"
    environment:
      - PORT=8080
      - RUST_LOG=${RUST_LOG:-info}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - AUTH_TOKEN=${AUTH_TOKEN:-}
    volumes:
      - rustatio_data:/data
      - ${TORRENTS_DIR:-./torrents}:/torrents
    restart: unless-stopped

volumes:
  rustatio_data:
